[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# via_ir disabled: the whole project (src + tests) compiles cleanly under the legacy
# pipeline, and the BackstopSimulator's delta-read is pipeline-independent (the spike
# used via_ir; semantics are identical). via_ir's IR optimizer hits a spurious
# stack-allocation limit in the EIP-712 test helper and provides no benefit here.
via_ir = false
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }]
